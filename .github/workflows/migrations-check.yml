name: Migrations Check

on:
  pull_request:
    branches: [main]

jobs:
  check-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nest_hex_boilerplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: nest_hex_boilerplate_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run existing migrations
        run: npm run migration:run

      - name: Check for pending schema changes
        run: |
          npm run migration:generate -- src/shared/infrastructure/database/migrations/CIDiffCheck
          if [ -f src/shared/infrastructure/database/migrations/*CIDiffCheck.ts ]; then
            echo "❌ Uncommitted schema changes detected — did you forget to generate a migration?"
            cat src/shared/infrastructure/database/migrations/*CIDiffCheck.ts
            exit 1
          fi
          echo "✅ No pending schema changes"
